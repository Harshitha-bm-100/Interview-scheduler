<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scheduled interviews</title>
  <style>
    body { background: #fff; color: #111; font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.7rem; text-align: left; }
  </style>
</head>
<body>
  <h1>Scheduled interviews</h1>

  <table border="1" cellpadding="6">
    <thead>
      <tr>
        <th>Interviewers</th>
        <th>Candidate</th>
        <th>Date</th>
        <th>Start time</th>
        <th>End time</th>
      </tr>
    </thead>
    <tbody>
      {% for interview in interviews %}
      <tr>
        <td>{{ interview.interviewers }}</td>
        <td>{{ interview.candidate }}</td>
        <td>{{ interview.date }}</td>
        <td>{{ interview.start_time }}</td>
        <td>{{ interview.end_time }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="5">No interviews yet.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <p><a href="{% url 'home' %}">Schedule another</a></p>
</body>
</html>
