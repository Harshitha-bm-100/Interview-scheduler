<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit interview</title>
  <style>
    body { background: #fff; color: #111; font-family: sans-serif; margin: 2rem; }
  </style>
</head>
<body>
  <h1>Edit interview</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save changes</button>
  </form>

  <p><a href="{% url 'view' %}">Back to scheduled interviews</a></p>
</body>
</html>
