<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Schedule an interview</title>
  <style>
    body { background: #fff; color: #111; font-family: sans-serif; margin: 2rem; }
    #id_interviewers {
      box-sizing: border-box;
      height: 4rem;
      overflow-y: scroll;
      border: 1px solid #ccc;
      padding: 0.4rem 0.7rem;
      list-style: none;
      margin: 0.3rem 0 0;
      width: 16rem;
    }
  </style>
</head>
<body>
  <h1>Schedule an interview</h1>

  {% if user.is_authenticated %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Save</button>
    </form>
  {% endif %}

  <p><a href="{% url 'view' %}">View scheduled interviews</a></p>
</body>
</html>
